[project]
name = "magika"
description = "A tool to determine the content type of a file with deep learning"
authors = [
    {name = "Magika Developers", email = "magika-dev@google.com"},
]
readme = "README.md"
license = {"text" = "Apache-2.0"}
requires-python = ">=3.8"
keywords = ["content type detection", "machine learning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development",
    "Typing :: Typed",
]
version = "1.0.3"

dependencies = []


[project.urls]
Homepage = "https://github.com/google/magika"
Documentation = "https://github.com/google/magika/blob/main/python/README.md"
Repository = "https://github.com/google/magika/"
Issues = "https://github.com/google/magika/issues"
Changelog = "https://github.com/google/magika/blob/main/python/CHANGELOG.md"


[dependency-groups]
dev = [
    "mypy>=1.11.2",
    "ipython>=8.12.3",
    "pytest>=8.3.2",
    "ruff>=0.14.3",
    "tomli-w>=1.0.0",
    "tomli>=2.0.1",
    "tqdm>=4.67.1",
    "dacite>=1.9.2",
    "requests>=2.32.4",
    "coverage>=7.6.1",
]

[build-system]
requires = ["maturin>=1.12.2"]
build-backend = "maturin"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv]
exclude-newer = "2 weeks"
required-version = ">=0.9.27"

[tool.maturin]
python-source = "src"
module-name = "magika._magika"
manifest-path = "../rust/pyo3/Cargo.toml"
data = "wheel_data"
locked = true
editable-profile = "release-fast"

[tool.coverage.run]
source = ["src/magika"]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["D", "E4", "E7", "E9", "F", "I001"]
ignore = ["D105"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["D"]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
