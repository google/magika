name: JS - publish
on:
  workflow_dispatch:
permissions:
  contents: read

env:
  UV_VERSION: "0.13.4"

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh

      # Release gate: js/package.json must declare a stable version whose frozen
      # supported-content-types snapshot (created by `just sync-kb` in the
      # release PR) is reproduced by this tree.
      - name: Verify release snapshot
        run: uv run scripts/sync_kb.py --verify-release js

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"

      - name: Build
        working-directory: js
        run: |
          yarn install --frozen-lockfile
          yarn run build
          yarn run test

      - name: Configure npm registry auth
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish
        working-directory: js
        run: yarn publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
