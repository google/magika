name: Rust - test

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    paths:
      - ".github/actions/rust-cache/**"
      - ".github/workflows/rust-*"
      - "assets/**"
      - "rust/**"
      - "tests_data/**"

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: ./changelog.sh
        working-directory: rust
  test:
    runs-on: ubuntu-26.04
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    strategy:
      matrix:
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup default ${{ matrix.toolchain }}
      - run: rustup component add rustfmt clippy
      # A new nightly ships every day, so its cache would rarely be hit and would
      # only take quota away from the stable entries.
      - if: matrix.toolchain == 'stable'
        uses: ./.github/actions/rust-cache
      - run: ./test.sh
        working-directory: rust
  tract:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - uses: ./.github/actions/rust-cache
      - run: ./test.sh
        working-directory: rust/tract-runtime
      - run: cargo check --manifest-path rust/tract-runtime/Cargo.toml --features cuda
      - run: cargo fmt --manifest-path rust/tract-bench/Cargo.toml -- --check
      - run: cargo test --manifest-path rust/tract-bench/Cargo.toml --all-features
      - run: cargo clippy --manifest-path rust/tract-bench/Cargo.toml --all-features --all-targets -- --deny=warnings
  # macOS is the only target that resolves to a GPU by default, and until this job existed nothing
  # ran the shipped command line there against known answers: the ubuntu test job never reaches the
  # Metal path, and a backend that computes the wrong thing still exits successfully.
  tract-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - uses: ./.github/actions/rust-cache
      - run: cargo test --manifest-path rust/tract-bench/Cargo.toml --all-features
      - run: cargo clippy --manifest-path rust/tract-bench/Cargo.toml --all-features --all-targets -- --deny=warnings
      - run: ./test.sh
        working-directory: rust/tract-runtime
      - run: ./test.sh
        working-directory: rust/cli
      # The C library links the Metal backend only on macOS, so only this job checks its link line.
      - run: ./test.sh
        working-directory: rust/ffi
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-cache
      - run: cargo build --profile=release-fast
        working-directory: rust/cli
      - run: rust/target/release-fast/magika -r tests_data/basic
