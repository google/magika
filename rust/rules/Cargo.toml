[package]
name = "magika-rules"
version = "0.1.0-dev"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.93"
description = "Bounded format rules for Magika evaluated in pure Rust"
repository = "https://github.com/google/magika"
include = ["/LICENSE", "/LICENSES", "/README.md", "/src"]

[[example]]
name = "capture"
required-features = ["bundled"]

[features]
default = ["bundled"]
bundled = []

[dependencies]
memchr = "2.7"
miniz_oxide = "0.8.9"

[dev-dependencies]
serde_json = "1"

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused = { level = "warn", priority = -1 }
unsafe_code = "forbid"
