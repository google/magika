name: KB - Check content types knowledge base

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    paths:
      - ".github/workflows/kb-check.yml"
      - "assets/active_model.txt"
      - "assets/content_types.yaml"
      - "assets/content_types_kb.min.json"
      - "assets/exposed_content_types.txt"
      - "assets/models/**"
      - "js/src/content-type-label.ts"
      - "js/src/content-types-infos.ts"
      - "python/src/magika/types/content_type_label.py"
      - "rust/ffi/src/content.rs"
      - "rust/lib/src/content.rs"
      - "rust/lib/src/model.rs"
      - "rust/lib/src/resolvers/**"
      - "rust/lib/src/resolvers.rs"
      - "scripts/sync_kb.py"

permissions:
  contents: read

env:
  UV_VERSION: "0.13.4"

jobs:
  check-kb:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh

      - name: Run sync_kb.py self-tests
        run: uv run scripts/sync_kb.py --self-test

      - name: Check all KB artifacts are in sync
        run: uv run scripts/sync_kb.py --check
