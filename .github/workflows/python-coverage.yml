name: Python - coverage

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-coverage.yml"

permissions:
  contents: read

env:
  UV_VERSION: "0.13.4"

jobs:
  coverage:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh

      - name: Install all projects dependencies (with the requested python version)
        working-directory: python
        run: |
          uv sync --locked --python 3.12 --all-extras --dev
          echo "PYTHONPATH=./src:$PYTHONPATH" >> $GITHUB_ENV

      - name: Running unit tests with coverage
        working-directory: python
        run: |
          uv run coverage run -m pytest tests -m "not slow"
          uv run coverage xml -i

      - name: Upload results
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          file: python/coverage.xml
          base-path: python
          flag-name: python
