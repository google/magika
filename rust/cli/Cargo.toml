[package]
name = "magika-cli"
version = "2.0.0-dev"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.93"
description = "Determines file content types using AI"
repository = "https://github.com/google/magika"
homepage = "https://securityresearch.google/magika"
keywords = ["cli", "file", "magic"]
categories = ["command-line-utilities", "filesystem", "parser-implementations"]
include = ["/LICENSE", "/src"]

[[bin]]
name = "magika"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.9", features = ["cargo", "derive", "string"] }
colored = "3.0.0"
cpu-time = { version = "1.0.0", optional = true }
crossbeam-channel = "0.5.16"
magika = { version = "2.0.0-dev", path = "../lib", features = ["serde"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"

# macOS uses Metal; CUDA is reachable only on the other targets.
[target.'cfg(not(target_os = "macos"))'.dependencies]
magika = { version = "2.0.0-dev", path = "../lib", features = ["cuda"] }

[features]
_mmap-spike = ["yara-rules", "magika/_mmap-spike"]
_sha2-accel-spike = ["_mmap-spike", "magika/_sha2-accel-spike"]
_blake3-spike = ["_mmap-spike", "magika/_blake3-spike"]
_blake3-rayon-spike = ["_blake3-spike", "magika/_blake3-rayon-spike"]
yara-rules = ["magika/yara-rules"]
_trace = ["dep:cpu-time"]

[profile.release]
codegen-units = 1
lto = true

[profile.release-fast]
inherits = "release"
codegen-units = 16
lto = false

[profile.dist]
inherits = "release"
