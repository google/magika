# Magika content types knowledge base (KB).
#
# This file is the human-editable source of truth for all the content types
# known to Magika. `assets/content_types_kb.min.json`, which all the bindings
# consume, is generated from it: do not edit the JSON file by hand.
#
# After editing this file, run `just sync-kb` (or `uv run scripts/sync_kb.py`)
# from the repository root to regenerate `assets/content_types_kb.min.json`,
# `assets/exposed_content_types.txt`, all language bindings, and generated docs.
#
# Format (validated by `scripts/sync_kb.py`):
# - All strings are quoted: content type names, `mime_type`, `group`,
#   `description`, and extensions (e.g., "null", "3gp"). Only the field names
#   and `null`, `true`, `false` are unquoted. This avoids YAML's implicit typing
#   pitfalls (e.g., an unquoted `null`, `yes`, or `1.0` is not a string).
# - Content types are sorted by name, and names match `^[a-z0-9_]+$`.
# - Each entry lists exactly these fields, in this order: `mime_type`, `group`,
#   `description`, `extensions`, `is_text`. Use `null` when `mime_type` is
#   unknown (or on unexposed stubs without curated `group`/`description`);
#   exposed content types must set non-`null` `group` and `description`.
# - Extensions have no leading `.` and are case-sensitive (e.g., "R").
# - `is_text` is `true` or `false`.
# - Do not add any other field. `in_heuristics`, `in_resolvers`, `in_ml_model`,
#   and `vetoed_by_resolvers` are derived automatically by `scripts/sync_kb.py`.

