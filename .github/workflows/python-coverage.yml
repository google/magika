name: Python - coverage

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-coverage.yml"

permissions:
  contents: read

env:
  UV_VERSION: "0.12.12"

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # pin@v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pin@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh

      - name: Install all projects dependencies (with the requested python version)
        working-directory: python
        run: |
          uv sync --python 3.12 --all-extras --dev
          echo "PYTHONPATH=./src:$PYTHONPATH" >> $GITHUB_ENV

      - name: Running unit tests with coverage
        working-directory: python
        run: |
          uv run coverage run -m pytest tests -m "not slow"
          uv run coverage xml -i

      - name: Upload results
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # pin@v2.3.6
        with:
          file: python/coverage.xml
          base-path: python
          flag-name: python
