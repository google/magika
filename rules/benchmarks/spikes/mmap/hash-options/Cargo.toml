[package]
name = "magika-hash-options"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
blake3 = { version = "=1.8.5", features = ["rayon", "neon"] }
sha2 = { version = "=0.10.9", features = ["asm"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
