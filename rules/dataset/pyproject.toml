[project]
name = "magika-datasets"
version = "0.1.0"
description = "Reproducible GitHub and VirusTotal dataset builder and hydrator"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "defusedxml==0.7.1",
    "pillow==12.3.0",
    "ppdeep==20260221",
    "pyarrow==25.0.1",
    "pyyaml==6.0.2",
    "tenacity==9.1.4",
]

[project.scripts]
magika-datasets = "magika_datasets.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
