# Deploys https://google.github.io/magika/ as a zero-dependency static site:
# - Redirects HTML requests (index.html and 404.html) to https://securityresearch.google/magika/
# - Serves CORS-enabled TensorFlow.js models (models/*) over GitHub Pages CDN for the `magika` JS package
name: Pages - deploy

on:
  # Runs on pushes targeting the default branch that update TFJS models or this workflow
  push:
    branches: ["main"]
    paths:
      - "website-ng/public/models/**"
      - ".github/workflows/github-pages.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - name: Assemble static Pages site
        run: |
          mkdir -p _site
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta http-equiv="refresh" content="0;URL='https://securityresearch.google/magika/'" />
              <link rel="canonical" href="https://securityresearch.google/magika/" />
              <title>Magika</title>
            </head>
            <body>
              <p>This page has moved to a <a href="https://securityresearch.google/magika/">new location</a>.</p>
            </body>
          </html>
          EOF
          cp _site/index.html _site/404.html
          cp -R website-ng/public/models _site/models
          test -f _site/models/standard_v3_2/model.json
          test -f _site/models/standard_v3_3/model.json
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "./_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
