[package]
name = "magika-rules"
version = "0.1.0-dev"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.93"
description = "Bounded format rules for Magika: a YARA subset evaluated in pure Rust"
repository = "https://github.com/google/magika"
include = ["!/src/bin", "/LICENSE", "/LICENSES", "/README.md", "/src"]

[[bin]]
name = "gen"
path = "src/bin/gen.rs"
required-features = ["_gen"]

[features]
default = ["bundled"]
bundled = []
# Internal features.
_gen = []

[dependencies]
memchr = "2.7"
miniz_oxide = "0.8.9"
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa", "dfa", "hybrid"] }
regex-syntax = "0.8.11"
yara-x-parser = "1.20.0"

[dev-dependencies]
serde_json = "1"

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused = { level = "warn", priority = -1 }
unsafe_code = "forbid"
