name: Python - build and release package

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      # Note: These need to match what specified in env.[TEST_]RELEASE_TAG_PREFIX below.
      - "python-v*"
      - "python-test-v*"
  pull_request:
    paths:
      - "python/**"
      - "rust/**"
      - "tests_data/**"
      - ".github/workflows/python-build-and-release-package.yml"
  schedule:
    - cron: "12 3 * * 4" # Run everything once per week.
    - cron: "12 3 * * 1" # Refresh the cache an additional time.
  release:
    types: [created]

permissions:
  contents: read

env:
  # Trigger for publishing to pypi and testpypi (and for pre-release checks
  # enforcement).
  RELEASE_TAG_PREFIX: "python-v"
  TEST_RELEASE_TAG_PREFIX: "python-test-v"
  UV_VERSION: "0.12.12"

jobs:
  # This job acts as a gatekeeper for releases, which are triggered by a tag
  # push. It performs critical pre-release checks. These checks are skipped for
  # non-release pushes.
  pre-release-checks:
    name: Pre-release checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pin@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
      - name: Build and stage magika CLI binary
        run: ./python/scripts/stage_cli.sh
      - name: Check package for release
        env:
          IS_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && (startsWith(github.ref_name, env.RELEASE_TAG_PREFIX) || startsWith(github.ref_name, env.TEST_RELEASE_TAG_PREFIX)) }}
        run: |
          if [[ "${IS_RELEASE_TAG}" == 'true' ]]; then
            FULL_TAG_REF="${GITHUB_REF}"
            TAG_NAME="${GITHUB_REF_NAME}"
            if [[ "${TAG_NAME}" == "${{ env.RELEASE_TAG_PREFIX }}"* ]]; then
              PREFIX_TO_REMOVE="refs/tags/${{ env.RELEASE_TAG_PREFIX }}"
            else
              PREFIX_TO_REMOVE="refs/tags/${{ env.TEST_RELEASE_TAG_PREFIX }}"
            fi
            TAG_VERSION="${FULL_TAG_REF#${PREFIX_TO_REMOVE}}"
            CHECKER_OPTIONS="--expected-version ${TAG_VERSION}"
          else
            CHECKER_OPTIONS="--report-only"
          fi
          # Note: this uses the magika python package installed via uv. Also,
          # pip is not available here, so we skip pip show check.
          uv run ./scripts/pre_release_check.py $CHECKER_OPTIONS --no-check-pip-show-package-version
        working-directory: python

  build-wheels:
    name: Build wheel on ${{ matrix.platform.os }} (${{ matrix.platform.target }})
    needs: [pre-release-checks]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: Linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: Linux
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: Linux
            runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            manylinux: "2014"
          - os: Linux
            runner: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            manylinux: "2_31"
          - os: Linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: "musllinux_1_2"
          - os: Linux
            runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            manylinux: "musllinux_1_2"
          - os: macOS
            runner: macos-14
            target: aarch64-apple-darwin
          - os: macOS
            runner: macos-14
            target: x86_64-apple-darwin
          - os: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          # --- Targets blocked by upstream tract-linalg 0.23.4 assembly/compiler limitations ---
          # 1. Windows ARM64: tract-linalg 0.23.4 build.rs fails on MSVC ARM64 (lacks MASM/Clang
          #    support for arm64simd GNU assembly kernels; causes LNK1181).
          # - os: Windows
          #   runner: windows-latest
          #   target: aarch64-pc-windows-msvc
          # 2. Linux ARMv7 (musl): tract-linalg 0.23.4 build.rs fails with conflicting FPU flags
          #    (-mfpu=vfpv3-d16 vs -mfpu=neon) in musllinux GCC cross-compiler.
          # - os: Linux
          #   runner: ubuntu-latest
          #   target: armv7-unknown-linux-musleabihf
          #   manylinux: "musllinux_1_2"
          # 3. Linux ARMv6: tract-linalg 0.23.4 build.rs fails looking for arm-linux-gnueabihf-gcc
          #    which is absent from the manylinux container PATH.
          # - os: Linux
          #   runner: ubuntu-latest
          #   target: arm-unknown-linux-gnueabihf
          #   manylinux: "auto"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Setup Rust
        if: matrix.platform.os != 'Linux'
        shell: bash
        run: |
          rustup default stable
          rustup target add ${{ matrix.platform.target }}

      # On macOS and Windows (which build on the host, not inside a manylinux container),
      # compile and stage the CLI binary into python/wheel_data/scripts/ before Maturin packages it.
      # On Linux, this is handled inside the manylinux container by python/scripts/stage_cli.sh via before-script-linux.
      - if: matrix.platform.os != 'Linux'
        name: Build and stage magika CLI (macOS/Windows)
        shell: bash
        run: ./python/scripts/stage_cli.sh ${{ matrix.platform.target }}

      # Build PyO3 wheel using maturin-action (Linux in manylinux container)
      - if: matrix.platform.os == 'Linux'
        name: Build wheel via Maturin (Linux)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux }}
          before-script-linux: "${{ github.workspace }}/python/scripts/stage_cli.sh ${{ matrix.platform.target }}"
          working-directory: python

      # Build PyO3 wheel using maturin-action (macOS/Windows on host)
      - if: matrix.platform.os != 'Linux'
        name: Build wheel via Maturin (macOS/Windows)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          working-directory: python

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.platform.target }}
          path: python/dist/*.whl

  # Download, install, and test the built wheels across supported Python versions (3.8 through 3.14).
  #
  # Tested Platforms:
  # - Linux x86_64 glibc (x86_64-unknown-linux-gnu) on ubuntu-latest
  # - macOS Apple Silicon (aarch64-apple-darwin) on macos-14
  # - Windows x64 (x86_64-pc-windows-msvc) on windows-latest
  #
  # Uncovered Build Targets (not tested in this matrix):
  # - x86_64-apple-darwin: Cross-compiled on macos-14 (Apple Silicon). The runner host
  #   interpreter is ARM64 (pip rejects x86_64 wheels). Running x64 Python via Rosetta
  #   is blocked for Python 3.8/3.9 due to lack of setup-python x64 binaries on macOS 14.
  # - aarch64-unknown-linux-gnu: Built via QEMU on x86_64 runner. Cannot execute natively
  #   on host; native ubuntu-24.04-arm runners lack setup-python binaries for Python 3.8/3.9.
  # - x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf:
  #   Built for musl (Alpine). Host runner uses glibc; pip rejects musllinux wheels on glibc.
  #   Requires a dedicated Alpine container test job.
  # - armv7-unknown-linux-gnueabihf, arm-unknown-linux-gnueabihf: 32-bit ARM (Raspberry Pi).
  #   Requires 32-bit ARM QEMU container emulation.
  # - riscv64gc-unknown-linux-gnu: 64-bit RISC-V. Requires RISC-V QEMU container emulation.
  # - aarch64-pc-windows-msvc: Cross-compiled on Windows x86_64. Windows x86_64 cannot execute
  #   Windows ARM64 binaries (no forward emulation).
  test-wheels:
    name: Test on ${{ matrix.platform.os }} (${{ matrix.platform.target }}) with Python ${{ matrix.python-version }}
    needs: [build-wheels]
    runs-on: ${{ matrix.platform.runner }}
    if: github.event.schedule != '12 3 * * 1'
    strategy:
      # We want to know in which exact situation the tests fail
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        platform:
          - os: Linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macOS
            runner: macos-14
            target: aarch64-apple-darwin
          - os: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ matrix.platform.target }}
          path: dist

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pin@v5
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh

      - name: Test wheel installation and execution with pip (venv)
        shell: bash
        run: |
          python -m venv test-pip-venv
          if [[ "${{ matrix.platform.os }}" == "Windows" ]]; then
            source test-pip-venv/Scripts/activate
          else
            source test-pip-venv/bin/activate
          fi
          WHEEL_PATH=$(python -c "import glob; print(glob.glob('dist/*.whl')[0])")
          pip install "$WHEEL_PATH"

          # Verify CLI execution
          magika --version
          magika tests_data/basic/python/code.py
          magika -r tests_data/basic

          # Verify Python library execution
          python -c "import magika; m = magika.Magika(); print(m)"
          python -c "import magika; m = magika.Magika(); res = m.identify_path('tests_data/basic/python/code.py'); assert res.ok and res.prediction.output.label == 'python', f'Unexpected: {res}'"

      - name: Test wheel installation and execution with uv (venv)
        shell: bash
        run: |
          uv venv test-uv-venv
          if [[ "${{ matrix.platform.os }}" == "Windows" ]]; then
            source test-uv-venv/Scripts/activate
          else
            source test-uv-venv/bin/activate
          fi
          WHEEL_PATH=$(python -c "import glob; print(glob.glob('dist/*.whl')[0])")
          uv pip install "$WHEEL_PATH"

          # Verify CLI execution
          magika --version
          magika tests_data/basic/python/code.py

          # Verify Python library execution
          python -c "import magika; m = magika.Magika(); print(m)"
          python -c "from pathlib import Path; import magika; m = magika.Magika(); res = m.identify_bytes(Path('tests_data/basic/python/code.py').read_bytes()); assert res.ok and res.prediction.output.label == 'python', f'Unexpected: {res}'"

      - name: Run pytest smoketests and quick test scripts
        shell: bash
        run: |
          if [[ "${{ matrix.platform.os }}" == "Windows" ]]; then
            source test-pip-venv/Scripts/activate
          else
            source test-pip-venv/bin/activate
          fi
          pip install pytest click
          python ./python/scripts/run_quick_test_magika_cli.py
          python ./python/scripts/run_quick_test_magika_module.py
          cd python
          pytest tests/test_magika_python_module.py -m smoketest

      - name: Check package for release readiness
        env:
          IS_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && (startsWith(github.ref_name, env.RELEASE_TAG_PREFIX) || startsWith(github.ref_name, env.TEST_RELEASE_TAG_PREFIX)) }}
        shell: bash
        run: |
          if [[ "${{ matrix.platform.os }}" == "Windows" ]]; then
            source ../test-pip-venv/Scripts/activate
          else
            source ../test-pip-venv/bin/activate
          fi
          if [[ "${IS_RELEASE_TAG}" == 'true' ]]; then
            FULL_TAG_REF="${GITHUB_REF}"
            TAG_NAME="${GITHUB_REF_NAME}"
            if [[ "${TAG_NAME}" == "${{ env.RELEASE_TAG_PREFIX }}"* ]]; then
              PREFIX_TO_REMOVE="refs/tags/${{ env.RELEASE_TAG_PREFIX }}"
            else
              PREFIX_TO_REMOVE="refs/tags/${{ env.TEST_RELEASE_TAG_PREFIX }}"
            fi
            TAG_VERSION="${FULL_TAG_REF#${PREFIX_TO_REMOVE}}"
            CHECKER_OPTIONS="--expected-version ${TAG_VERSION}"
          else
            CHECKER_OPTIONS="--report-only"
          fi
          # Note: this uses the magika python package that was just built and installed via pip.
          python ./scripts/pre_release_check.py $CHECKER_OPTIONS
        working-directory: python

  # Adapted from https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
  # Note: The publishing is only done with pushes of release tags.
  publish-to-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag' && contains(github.ref_name, 'python')
    needs: [test-wheels]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/magika

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Flatten artifacts structure
        run: |
          # List all files for debugging
          ls -alR artifacts/

          # Find all files inside the subdirectories and move them up
          find artifacts/ -mindepth 2 -type f -exec mv -t artifacts/ {} +

          # Remove the now-empty subdirectories
          find artifacts/ -mindepth 1 -type d -empty -delete

          # Check structure after flattening
          ls -alR artifacts/

      - name: Publish distribution to PyPI
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, env.RELEASE_TAG_PREFIX)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: artifacts/

  # Note: The publishing is only done with pushes of test release tags.
  publish-to-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'push' && github.ref_type == 'tag' && contains(github.ref_name, 'python')
    needs: [test-wheels]
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/magika

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Flatten artifacts structure
        run: |
          # List all files for debugging
          ls -alR artifacts/

          # Find all files inside the subdirectories and move them up
          find artifacts/ -mindepth 2 -type f -exec mv -t artifacts/ {} +

          # Remove the now-empty subdirectories
          find artifacts/ -mindepth 1 -type d -empty -delete

          # Check structure after flattening
          ls -alR artifacts/

      - name: Publish distribution to TestPyPI
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, env.TEST_RELEASE_TAG_PREFIX)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: artifacts/
          repository-url: https://test.pypi.org/legacy/
