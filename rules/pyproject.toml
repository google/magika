[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "magika-rules-benchmark"
version = "1.2.0"
description = "Correctness, coverage and disk performance evaluation for Magika rules"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pyarrow>=20,<24", "yara-x==1.20.0", "tabulate>=0.9,<1"]

[project.optional-dependencies]
comparators = ["stringzilla==5.1.2"]

[project.scripts]
magika-rules-benchmark = "magika_rules_benchmark:main"
magika-compare = "magika_rules_benchmark.comparison:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["benchmark/src/magika_rules_benchmark"]

[tool.pytest.ini_options]
testpaths = ["benchmark/tests"]
addopts = "-ra --strict-markers"
markers = [
  "native: requires MAGIKA_TEST_BINARY and MAGIKA_VECTORSCAN_LIBRARY",
  "packaging: builds staged Rust packages",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Exact script used for the archived measurement; its bytes are recorded in artifacts.json.
extend-exclude = ["benchmarks/reports/2026-09-09-handoff-validation/prepare.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
