name: Python - run test suite

on:
  workflow_dispatch:
  # Also called by python-build-test-and-release-package.yml, which runs these
  # source checks before building and testing the wheels.
  workflow_call:
  push:
    branches:
      - "main"
  pull_request:
    paths:
      - "python/**"
      - "rust/**"
      - "scripts/check_copyright.py"
      - "tests_data/**"
      - ".github/actions/rust-cache/**"
      - ".github/workflows/python-test-suite.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.13.4"

jobs:
  # Run the source checks and the full test suite on a single representative
  # configuration. The built wheels are tested across the full OS × Python
  # version matrix in python-build-test-and-release-package.yml.
  unit-testing:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh

      - name: Cache Rust build
        uses: ./.github/actions/rust-cache

      - name: Build and stage magika CLI binary
        run: ./python/scripts/build_and_stage_cli.sh --profile release-fast

      - name: Check that uv.lock is in sync
        working-directory: python
        run: uv lock --check

      - name: Install all projects dependencies (with the requested python version)
        working-directory: python
        run: uv sync --locked --python ${{ env.PYTHON_VERSION }} --all-extras --dev

      - name: Print python version
        working-directory: python
        run: uv run --python ${{ env.PYTHON_VERSION }} python --version

      - name: Run ruff check
        working-directory: python
        run: uv run --python ${{ env.PYTHON_VERSION }} ruff check --verbose

      - name: Run ruff format --check
        working-directory: python
        run: uv run --python ${{ env.PYTHON_VERSION }} ruff format --check --verbose

      - name: Run ty check
        working-directory: python
        run: uv run --python ${{ env.PYTHON_VERSION }} ty check

      - name: Run copyright checks
        run: uv run ./scripts/check_copyright.py

      - name: Run the python tests suite
        working-directory: python
        run: uv run --python ${{ env.PYTHON_VERSION }} pytest tests -m "not slow"

      - name: Run magika --version
        working-directory: python
        run: uv run --python ${{ env.PYTHON_VERSION }} magika --version

      - name: Run magika with tests_data
        working-directory: python
        run: uv run --python ${{ env.PYTHON_VERSION }} magika -r ../tests_data/basic

      - name: Run "magika cli" quick tests
        working-directory: python
        run: uv run --python ${{ env.PYTHON_VERSION }} scripts/run_quick_test_magika_cli.py

      - name: Run "magika module" quick tests
        working-directory: python
        run: uv run --python ${{ env.PYTHON_VERSION }} scripts/run_quick_test_magika_module.py --print-inference-stats

      # Report-only: this shows which versions CI sees (module, CLI, etc.) so
      # they can be inspected before tagging a release. The strict check against
      # the release tag runs on the built wheels in
      # python-build-test-and-release-package.yml.
      - name: Run pre-release checks (report only)
        working-directory: python
        # Note: pip is not available in the uv environment, so we skip the pip
        # show check.
        run: uv run --python ${{ env.PYTHON_VERSION }} scripts/pre_release_check.py --report-only --no-check-pip-show-package-version

  changelog-check:
    # This compares against the PR's base branch, so it only makes sense on PRs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check for undocumented changes
        run: ./scripts/check_changelog.sh ${GITHUB_BASE_REF}
        working-directory: python
