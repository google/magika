name: POC - PyO3 Multi-Platform Wheels

on:
  workflow_dispatch:
  push:
    branches:
      - "pyo3"
      - "poc-pyo3"

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheel on ${{ matrix.platform.os }} (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: Linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: Linux
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: Linux
            runner: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            manylinux: "2014"
          - os: Linux
            runner: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
            manylinux: "auto"
          - os: Linux
            runner: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            manylinux: "2_31"
          - os: Linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: "musllinux_1_2"
          - os: Linux
            runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            manylinux: "musllinux_1_2"
          - os: Linux
            runner: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            manylinux: "musllinux_1_2"
          - os: macOS
            runner: macos-14
            target: aarch64-apple-darwin
          - os: macOS
            runner: macos-14
            target: x86_64-apple-darwin
          - os: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - os: Windows
            runner: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      - name: Setup Rust
        if: matrix.platform.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      # On macOS and Windows (which build on the host, not inside a manylinux container),
      # compile and stage the CLI binary into python/wheel_data/scripts/ before Maturin packages it.
      # On Linux, this is handled inside the manylinux container by python/scripts/stage_cli.sh via before-script-linux.
      - if: matrix.platform.os != 'Linux'
        name: Build and stage magika CLI (macOS/Windows)
        shell: bash
        run: ./python/scripts/stage_cli.sh ${{ matrix.platform.target }}

      # Build PyO3 wheel using maturin-action (Linux in manylinux container)
      - if: matrix.platform.os == 'Linux'
        name: Build wheel via Maturin (Linux)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux }}
          before-script-linux: "${{ github.workspace }}/python/scripts/stage_cli.sh"
          working-directory: python

      # Build PyO3 wheel using maturin-action (macOS/Windows on host)
      - if: matrix.platform.os != 'Linux'
        name: Build wheel via Maturin (macOS/Windows)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          working-directory: python

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.target }}
          path: python/dist/*.whl

  # Test the built wheels across supported Python versions (3.8 through 3.14).
  #
  # Tested Platforms:
  # - Linux x86_64 glibc (x86_64-unknown-linux-gnu) on ubuntu-latest
  # - macOS Apple Silicon (aarch64-apple-darwin) on macos-14
  # - Windows x64 (x86_64-pc-windows-msvc) on windows-latest
  #
  # Uncovered Build Targets (not tested in this matrix):
  # - x86_64-apple-darwin: Cross-compiled on macos-14 (Apple Silicon). The runner host
  #   interpreter is ARM64 (pip rejects x86_64 wheels). Running x64 Python via Rosetta
  #   is blocked for Python 3.8/3.9 due to lack of setup-python x64 binaries on macOS 14.
  # - aarch64-unknown-linux-gnu: Built via QEMU on x86_64 runner. Cannot execute natively
  #   on host; native ubuntu-24.04-arm runners lack setup-python binaries for Python 3.8/3.9.
  # - x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf:
  #   Built for musl (Alpine). Host runner uses glibc; pip rejects musllinux wheels on glibc.
  #   Requires a dedicated Alpine container test job.
  # - armv7-unknown-linux-gnueabihf, arm-unknown-linux-gnueabihf: 32-bit ARM (Raspberry Pi).
  #   Requires 32-bit ARM QEMU container emulation.
  # - riscv64gc-unknown-linux-gnu: 64-bit RISC-V. Requires RISC-V QEMU container emulation.
  # - aarch64-pc-windows-msvc: Cross-compiled on Windows x86_64. Windows x86_64 cannot execute
  #   Windows ARM64 binaries (no forward emulation).
  test-wheels:
    name: Test on ${{ matrix.platform.os }} (${{ matrix.platform.target }}) with Python ${{ matrix.python-version }}
    needs: [build-wheels]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        platform:
          - os: Linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macOS
            runner: macos-14
            target: aarch64-apple-darwin
          - os: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.platform.target }}
          path: dist

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Test wheel installation and execution with pip (venv)
        shell: bash
        run: |
          python -m venv test-pip-venv
          if [[ "${{ matrix.platform.os }}" == "Windows" ]]; then
            source test-pip-venv/Scripts/activate
          else
            source test-pip-venv/bin/activate
          fi
          WHEEL_PATH=$(python -c "import glob; print(glob.glob('dist/*.whl')[0])")
          pip install "$WHEEL_PATH"

          # Verify CLI execution
          magika --version
          magika tests_data/basic/python/code.py
          magika -r tests_data/basic

          # Verify Python library execution
          python -c "import magika; m = magika.Magika(); print(m)"
          python -c "import magika; m = magika.Magika(); res = m.identify_path('tests_data/basic/python/code.py'); assert res.ok and res.prediction.output.label == 'python', f'Unexpected: {res}'"

      - name: Test wheel installation and execution with uv (venv)
        shell: bash
        run: |
          uv venv test-uv-venv
          if [[ "${{ matrix.platform.os }}" == "Windows" ]]; then
            source test-uv-venv/Scripts/activate
          else
            source test-uv-venv/bin/activate
          fi
          WHEEL_PATH=$(python -c "import glob; print(glob.glob('dist/*.whl')[0])")
          uv pip install "$WHEEL_PATH"

          # Verify CLI execution
          magika --version
          magika tests_data/basic/python/code.py

          # Verify Python library execution
          python -c "import magika; m = magika.Magika(); print(m)"
          python -c "from pathlib import Path; import magika; m = magika.Magika(); res = m.identify_bytes(Path('tests_data/basic/python/code.py').read_bytes()); assert res.ok and res.prediction.output.label == 'python', f'Unexpected: {res}'"

      - name: Run pytest smoketests
        shell: bash
        run: |
          if [[ "${{ matrix.platform.os }}" == "Windows" ]]; then
            source test-pip-venv/Scripts/activate
          else
            source test-pip-venv/bin/activate
          fi
          pip install pytest
          cd python
          pytest tests/test_magika_python_module.py -m smoketest

